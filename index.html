<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>ASESMEN DATABASE ADMINISTRATION</title>
<style>
:root {
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50:  #f8fafc;
  
  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-light: #eff6ff;
  --brand-border: #bfdbfe;
  
  --g: #10b981; --g-bg: #d1fae5; --g-txt: #065f46; --g-border: #a7f3d0;
  --r: #e11d48; --r-bg: #ffe4e6; --r-txt: #9f1239; --r-border: #fecdd3;
  --y: #f59e0b; --y-bg: #fef3c7; --y-txt: #92400e; --y-border: #fde68a;
  
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 10px 30px -5px rgba(15, 23, 42, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  min-height: 100vh;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--slate-800);
  background-color: #f8fafc;
  background-image: 
    radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.04) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
  background-attachment: fixed;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* Header HUD */
.hud {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.hud .in {
  max-width: 960px;
  margin: auto;
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.lg {
  font-size: 1.15rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

.mk {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--brand), #1d4ed8);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.1rem;
}

.pl {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 0.92rem;
}

.av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--brand-light);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.9rem;
  border: 1.5px solid rgba(37, 99, 235, 0.3);
}

/* Container & Cards */
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

.card {
  background: #ffffff;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: clamp(22px, 4vw, 34px);
  margin: 20px 0 24px;
}

h1 {
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  line-height: 1.2;
  margin: 0 0 0.3em;
  font-weight: 800;
  color: var(--slate-900);
}

h1 .hl {
  color: var(--brand);
  background: var(--brand-light);
  padding: 2px 12px;
  border-radius: 10px;
  display: inline-block;
}

h2, h3 {
  margin: 0.3em 0 0.5em;
  color: var(--slate-900);
  font-weight: 800;
}

.sub {
  font-weight: 700;
  color: var(--brand);
  margin: 0 0 1em;
  font-size: 1.05rem;
}

.login {
  max-width: 650px;
  margin: 24px auto;
}

/* Forms & Inputs */
label {
  font-weight: 700;
  display: block;
  font-size: 0.9rem;
  color: var(--slate-700);
  margin-bottom: 6px;
}

input, select {
  display: block;
  width: 100%;
  min-height: 48px;
  margin: 4px 0 18px;
  padding: 12px 16px;
  border: 1.5px solid var(--slate-200);
  border-radius: 12px;
  font: inherit;
  background: #fff;
  color: var(--slate-900);
  transition: border-color 0.2s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.input-error {
  border-color: var(--r) !important;
  background-color: #fff1f2 !important;
}

/* Buttons System */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 10px 24px;
  margin: 8px 10px 6px 0;
  background: var(--brand);
  color: #fff;
  border: none;
  border-radius: 12px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
  transition: all 0.18s ease;
  text-decoration: none;
}

.btn:hover {
  background: var(--brand-hover);
  transform: translateY(-2px);
}

.btn.alt {
  background: #fff;
  color: var(--slate-700);
  border: 1.5px solid var(--slate-200);
  box-shadow: var(--shadow-sm);
}

.btn.alt:hover {
  background: var(--slate-50);
  color: var(--slate-900);
}

.btn.danger {
  background: var(--r-bg);
  color: var(--r-txt);
  border: 1.5px solid var(--r-border);
}

.btn.danger:hover {
  background: #ffe4e6;
}

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  min-height: 54px;
  padding: 14px 18px;
  margin: 10px 0;
  background: #fff;
  color: var(--slate-800);
  border: 1.5px solid var(--slate-200);
  border-radius: 14px;
  font: inherit;
  cursor: pointer;
  transition: all 0.18s ease;
}

.opt:hover {
  border-color: var(--brand);
  background: var(--brand-light);
}

.opt.selected {
  border-color: var(--brand);
  background: var(--brand-light);
  font-weight: 700;
}

.opt i {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--slate-100);
  color: var(--slate-700);
  display: grid;
  place-items: center;
  font-style: normal;
  font-weight: 700;
}

.opt.selected i {
  background: var(--brand);
  color: #fff;
}

.chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 14px;
  font-size: 0.84rem;
  font-weight: 700;
  border-radius: 99px;
}
.chip.ok { background: var(--g-bg); color: var(--g-txt); border: 1px solid var(--g-border); }
.chip.bad { background: var(--r-bg); color: var(--r-txt); border: 1px solid var(--r-border); }

/* Anti-cheat overlay warning */
.anti-cheat-alert {
  background: var(--r-bg);
  border: 1.5px solid var(--r-border);
  color: var(--r-txt);
  padding: 12px 18px;
  border-radius: 12px;
  margin-bottom: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Stepper UI */
.stp { display: flex; gap: 6px; margin: 10px 0 20px; overflow-x: auto; padding-bottom: 4px; }
.stp span {
  flex: 1; min-width: 36px; height: 36px; border-radius: 10px; background: var(--slate-100);
  color: var(--slate-600); display: grid; place-items: center; font-weight: 700; font-size: 0.88rem;
  border: 1px solid var(--slate-200); cursor: pointer;
}
.stp .on { background: var(--brand); color: #fff; border-color: var(--brand); }
.stp .dn { background: var(--g-bg); color: var(--g-txt); border-color: var(--g-border); }

.summary-hero {
  text-align: center;
  padding: 28px 20px;
  background: linear-gradient(180deg, rgba(37, 99, 235, 0.06) 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin: 20px 0;
}
.stat-box {
  background: var(--slate-50);
  border: 1px solid var(--slate-200);
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
}
.stat-box .val { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
.stat-box .lbl { font-size: 0.78rem; font-weight: 700; color: var(--slate-500); text-transform: uppercase; margin-top: 4px; }

#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--slate-900); color: #fff; padding: 12px 26px; border-radius: 99px;
  display: none; z-index: 100; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.3); font-weight: 600;
}

.dlg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.6); display: grid; place-items: center; padding: 16px; }
.dlg[hidden] { display: none; }
.dlg-box { background: #fff; border-radius: var(--radius); padding: 24px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
.dlg-err { color: var(--r-txt); min-height: 1.3em; font-weight: 600; margin: 4px 0 8px; }
.review-item { border: 1px solid var(--slate-200); border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fff; }

.noselect{-webkit-user-select:none;user-select:none}
.dlg-box p{white-space:pre-line}
.dlg-box.warn{border-top:6px solid var(--r)}
.dlg-box.warn h3{color:var(--r-txt)}
.pesan{border-radius:14px;padding:16px 20px;margin:16px 0;border:1.5px solid var(--slate-200)}
.pesan h3{color:inherit;margin:0 0 6px}
.pesan.ok{background:var(--g-bg);border-color:var(--g-border);color:var(--g-txt)}
.pesan.semangat{background:var(--y-bg);border-color:var(--y-border);color:var(--y-txt)}
.pesan.info{background:var(--r-bg);border-color:var(--r-border);color:var(--r-txt)}
.hud .pl{flex-wrap:wrap;justify-content:flex-end}
body.terkunci #app{filter:blur(14px);pointer-events:none;-webkit-user-select:none;user-select:none}
.dlg-box.warn{box-shadow:0 0 0 9999px rgba(15,23,42,.35),var(--shadow-lg)}
@media print{body{display:none!important}}
</style>
</head>
<body>

<header id="hd" class="hud"></header>
<main id="app" class="wrap"></main>
<div id="toast" role="status"></div>
<div id="dlg" class="dlg" hidden></div>

<script>
/* ===== BANK 20 SOAL ASESMEN PERTEMUAN 9: OPTIMASI PERFORMA SISTEM ===== */
const BANK_SOAL = [
  {
    "t": 1,
    "q": "Mengapa pengurangan operasi baca dan tulis ke subsistem penyimpanan disk (Disk I/O) menjadi fokus utama dalam optimasi performa basis data relasional?",
    "o": [
      "Karena kapasitas penyimpanan sekunder jauh lebih terbatas dibandingkan ruang memori utama sehingga baris data sering terhapus otomatis",
      "Karena waktu akses media penyimpanan sekunder ribuan hingga jutaan kali lebih lambat dibandingkan pemrosesan di memori utama (RAM)",
      "Karena seluruh proses pengurutan kueri dan penggabungan tabel hanya dapat dieksekusi langsung di atas sektor cakram penyimpanan",
      "Karena setiap permintaan pembacaan data dari RAM wajib disinkronkan terlebih dahulu ke berkas log transaksi sebelum dikirim ke klien"
    ],
    "a": 1,
    "e": "Akses baca/tulis pada subsistem Disk I/O membutuhkan waktu ribuan hingga jutaan kali lebih lambat dibandingkan operasi di dalam RAM dan register CPU, sehingga menekan Disk I/O fisik menjadi kunci utama optimasi performa."
  },
  {
    "t": 1,
    "q": "Bagaimana pendekatan manajemen performa proaktif yang harus dijalankan oleh seorang Database Administrator (DBA) untuk mencegah kemacetan (bottleneck) Disk I/O?",
    "o": [
      "Menunggu laporan kelumpuhan aplikasi dari pengguna terlebih dahulu sebelum menambah kapasitas prosesor dan mengganti skema tabel",
      "Menonaktifkan pencatatan transaksi secara berkala agar seluruh beban penulisan dialihkan sementara ke berkas cadangan eksternal",
      "Menjalankan pemantauan berkelanjutan (ongoing monitoring) serta memadukan rancangan indeks presisi dengan retensi halaman aktif di RAM",
      "Memindahkan seluruh tabel transaksional ke mesin penyimpanan sementara agar tidak pernah menyentuh media penyimpanan permanen"
    ],
    "a": 2,
    "e": "Manajemen performa wajib dijalankan secara proaktif melalui pemantauan berkelanjutan (ongoing monitoring) dengan mengombinasikan strategi pengurangan pembacaan blok (indeks presisi) dan retensi halaman aktif di InnoDB Buffer Pool."
  },
  {
    "t": 2,
    "q": "Bagaimana konsekuensi arsitektural (trade-off) dari penambahan struktur indeks sekunder terhadap kinerja operasi basis data?",
    "o": [
      "Mempercepat penelusuran baris pada operasi pembacaan (SELECT), tetapi menambah konsumsi ruang penyimpanan serta beban penulisan (write overhead)",
      "Mempercepat seluruh operasi penyisipan baris baru (INSERT), tetapi memperlambat pemindaian rentang nilai pada kueri pembacaan terurut",
      "Menghilangkan kebutuhan alokasi memori pada InnoDB Buffer Pool, tetapi memaksa setiap kueri melakukan pemindaian penuh seluruh tabel",
      "Mengurangi ukuran berkas tablespace di media penyimpanan, tetapi menonaktifkan konsistensi kunci primer saat terjadi pembaruan data"
    ],
    "a": 0,
    "e": "Setiap indeks mempercepat pencarian data saat pembacaan, namun menimbulkan biaya pemeliharaan berupa tambahan ruang penyimpanan serta beban penulisan (write overhead) karena setiap INSERT, UPDATE, dan DELETE wajib memperbarui struktur indeks terkait."
  },
  {
    "t": 2,
    "q": "Pada indeks komposit B+Tree dengan urutan kolom (kode_fakultas, tahun_terbit), mengapa kueri dengan klausa WHERE tahun_terbit = 2025 tidak dapat menelusuri pohon indeks secara optimal?",
    "o": [
      "Karena kolom bertipe bilangan bulat tidak pernah disimpan di dalam simpul daun struktur B+Tree pada mesin penyimpanan InnoDB",
      "Karena mesin InnoDB hanya mengizinkan satu kolom kunci digunakan sebagai kondisi penyaringan pada setiap eksekusi kueri tunggal",
      "Karena nilai tahun terbit selalu dipetakan menggunakan fungsi hash acak sehingga urutan kronologisnya hilang di dalam pohon indeks",
      "Karena entri indeks komposit diurutkan mulai dari kolom awalan paling kiri (leftmost prefix), sehingga pencarian tanpa kolom pertama tidak terarah"
    ],
    "a": 3,
    "e": "Indeks komposit B+Tree menyusun kunci secara hierarkis berdasarkan prinsip leftmost prefix (dimulai dari kolom pertama kode_fakultas), sehingga pencarian yang langsung menyaring kolom kedua tanpa kolom pertama tidak dapat memanfaatkan urutan pohon secara optimal."
  },
  {
    "t": 3,
    "q": "Karakteristik arsitektural manakah pada struktur B+Tree InnoDB yang menjelaskan kemampuannya memproses kueri rentang (seperti BETWEEN atau >=) secara efisien?",
    "o": [
      "Simpul akar (root node) menyimpan seluruh salinan kolom baris tabel sehingga kueri rentang selesai dalam satu kali pembacaan blok",
      "Simpul daun (leaf nodes) menyimpan nilai kunci secara terurut dan saling terhubung secara berantai dua arah (doubly linked list)",
      "Setiap simpul cabang memetakan nilai kunci melalui fungsi hash deterministik agar lompatan antarbatas rentang berjalan konstan",
      "Struktur pohon meniadakan penyeimbangan tinggi cabang sehingga data terbaru selalu ditempatkan pada simpul paling atas"
    ],
    "a": 1,
    "e": "Pada struktur B+Tree InnoDB, seluruh nilai kunci tersimpan secara terurut pada simpul daun (leaf nodes) yang saling terhubung melalui doubly linked list, memungkinkan pemindaian rentang (range scan) berjalan berurutan secara efisien."
  },
  {
    "t": 4,
    "q": "Apa karakteristik mendasar yang membedakan organisasi penyimpanan Clustered Index pada mesin InnoDB dibandingkan indeks non-clustered?",
    "o": [
      "Clustered Index menyusun fisik baris tabel mengikuti urutan kunci primer dan menyimpan seluruh kolom baris langsung di dalam simpul daunnya",
      "Clustered Index memisahkan berkas fisik baris tabel dari pohon indeks dengan menyimpan penunjuk alamat sektor cakram pada setiap simpul",
      "Clustered Index dapat dibuat lebih dari satu pada tabel yang sama untuk mengurutkan baris data berdasarkan beberapa kolom berbeda sekaligus",
      "Clustered Index hanya menyimpan nilai kunci primer dan nilai ringkasan hash tanpa menyertakan kolom atribut lain di dalam simpul daun"
    ],
    "a": 0,
    "e": "Setiap tabel InnoDB memiliki tepat satu Clustered Index (otomatis berasal dari PRIMARY KEY) yang menyatukan struktur indeks dengan penyimpanan fisik seluruh kolom baris data di dalam simpul daun (leaf node)."
  },
  {
    "t": 5,
    "q": "Mengapa kueri yang menyaring data melalui Secondary Index pada mesin InnoDB sering kali memicu mekanisme pencarian dua tahap (double lookup atau bookmark lookup)?",
    "o": [
      "Karena simpul daun Secondary Index hanya menyimpan nomor blok halaman disk yang harus diverifikasi ulang melalui kamus data sistem",
      "Karena mesin InnoDB wajib membandingkan hasil pencarian Secondary Index dengan isi Hash Index untuk memastikan keunikan setiap baris",
      "Karena simpul daun Secondary Index hanya menyimpan nilai kolom terindeks beserta Primary Key, sehingga sisa kolom harus diambil dari Clustered Index",
      "Karena setiap pembacaan melalui Secondary Index otomatis memicu penyusunan ulang seluruh halaman daun sebelum baris dikirim ke aplikasi"
    ],
    "a": 2,
    "e": "Simpul daun Secondary Index menyimpan nilai kolom yang diindeks dan salinan Primary Key baris tersebut. Jika kueri membutuhkan kolom lain di luar indeks, InnoDB melakukan pencarian kedua (bookmark lookup) menuju Clustered Index."
  },
  {
    "t": 5,
    "q": "Dalam kondisi bagaimanakah sebuah Secondary Index berperan sebagai Covering Index sehingga meniadakan kebutuhan akses tambahan ke tabel utama?",
    "o": [
      "Apabila tabel utama berukuran lebih kecil daripada kapasitas alokasi memori sort_buffer_size dan join_buffer_size pada sesi klien",
      "Apabila seluruh kolom yang diminta pada klausa penyaringan memiliki tingkat kardinalitas rendah dan tidak mengandung nilai kosong",
      "Apabila kueri hanya dijalankan pada jam beban kerja rendah setelah proses reorganisasi halaman fisik melalui perintah OPTIMIZE TABLE",
      "Apabila seluruh kolom yang diminta oleh kueri sudah tersedia lengkap di dalam simpul daun (leaf node) struktur indeks sekunder tersebut"
    ],
    "a": 3,
    "e": "Ketika seluruh kolom yang dibutuhkan kueri sudah tercakup di dalam leaf node Secondary Index, kondisi optimal ini disebut Covering Index karena InnoDB tidak perlu melakukan bookmark lookup ke Clustered Index."
  },
  {
    "t": 6,
    "q": "Mengapa struktur Hash Index tidak dapat dimanfaatkan untuk mempercepat operasi pencarian rentang (<, >, BETWEEN) maupun pengurutan (ORDER BY)?",
    "o": [
      "Karena fungsi hash memetakan nilai kunci secara deterministik ke alamat pointer memori tanpa mempertahankan urutan logis antarnilai kunci",
      "Karena tabel pemetaan hash hanya mampu menyimpan kolom bertipe teks panjang sehingga perbandingan aritmetika tidak dapat dieksekusi",
      "Karena setiap entri di dalam bucket hash selalu diurutkan berdasarkan waktu penyisipan transaksi dan bukan berdasarkan nilai kolom kunci",
      "Karena struktur indeks hash secara otomatis menghapus penunjuk antarhalaman setiap kali transaksi pembacaan selesai dijalankan"
    ],
    "a": 0,
    "e": "Hash Index memetakan nilai kunci menggunakan fungsi hash ke lokasi pointer memori untuk pencocokan kesetaraan penuh (=, <=>, IN) saja, sehingga tidak mempertahankan urutan logis untuk operasi rentang (<, >) maupun ORDER BY."
  },
  {
    "t": 6,
    "q": "Apa perbedaan mendasar antara penggunaan indeks HASH eksplisit pada mesin MEMORY dengan fitur Adaptive Hash Index (AHI) pada mesin InnoDB?",
    "o": [
      "Indeks HASH eksplisit hanya mendukung pemindaian rentang berurutan, sedangkan Adaptive Hash Index khusus melayani pencarian teks semantik",
      "Indeks HASH eksplisit didefinisikan pada skema tabel oleh pengguna, sedangkan Adaptive Hash Index dikelola otomatis secara internal oleh InnoDB",
      "Indeks HASH eksplisit tersimpan permanen di dalam berkas tablespace disk, sedangkan Adaptive Hash Index ditulis ke berkas log transaksi",
      "Indeks HASH eksplisit digunakan untuk menyusun fisik baris tabel utama, sedangkan Adaptive Hash Index menggantikan fungsi kunci primer"
    ],
    "a": 1,
    "e": "Hash Index eksplisit dibuat secara manual pada definisi tabel (seperti pada MEMORY engine), sedangkan Adaptive Hash Index (AHI) merupakan optimasi internal yang dibangun dan dikelola otomatis oleh mesin InnoDB di memori."
  },

/* ===================== UTILITAS ===================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
function rnd(n) { // acak seragam (tanpa modulo bias)
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n; let x;
    do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
    return x % n;
  }
  return Math.floor(Math.random() * n);
}
function perm(n) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let toastT;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200);
}
async function sha(s) {
  if (!(window.crypto && crypto.subtle)) return null;
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function mulaiUjian() {
  if (!STORAGE_OK || !BANK_OK) return toast('Sistem belum siap. Hubungi dosen.');
  const el = { nama: $('#nama'), nim: $('#nim'), kelas: $('#kelas') };
  Object.values(el).forEach(e => e.classList.remove('input-error'));
  const nama = el.nama.value.trim().replace(/\s+/g, ' ');
  const nim = normNim(el.nim.value), kelas = el.kelas.value;
  if (!nama) { el.nama.classList.add('input-error'); return toast('PERINGATAN: Nama Lengkap wajib diisi!'); }
  if (!nim) { el.nim.classList.add('input-error'); return toast('PERINGATAN: NIM wajib diisi!'); }
  if (!/^[A-Z0-9._-]{4,20}$/.test(nim)) { el.nim.classList.add('input-error'); return toast('NIM tidak valid (4–20 karakter huruf/angka).'); }
  if (!kelas) { el.kelas.classList.add('input-error'); return toast('PERINGATAN: Silakan pilih Kelas TIF3A atau TIF3B!'); }
  if (CFG.DAFTAR_NIM.length && !CFG.DAFTAR_NIM.map(normNim).includes(nim)) return blokir('NIM tidak terdaftar sebagai peserta asesmen ini.');

  const ses = lsGet(K_SES + nim, null);
  if (hasilSemua().some(r => normNim(r.nim) === nim) || (ses && ses.status === 'final'))
    return blokir('Asesmen untuk NIM ini sudah tercatat dan tidak dapat diulang.\nJika ada kendala teknis, hubungi dosen pengampu.');

  if (ses && ses.status === 'ongoing') { // lanjutkan sesi yang terputus
    if (ses.tab !== TAB && Date.now() - ses.hb < 6000)
      return blokir('Sesi ujian untuk NIM ini sedang aktif di tab/jendela lain.\nJika baru memuat ulang halaman, tunggu ±10 detik lalu coba lagi.');
    S = { ...ses, tab: TAB, locked: false, done: false, lastV: 0, fsOk: false, noFS: false };
    if (S.endAt && Date.now() >= S.endAt) { selesaikan('waktu'); return; }
    S.v++; S.log.push({ t: Date.now(), r: 'Keluar atau memuat ulang halaman ujian' });
    if (!saveSes()) return toast('Gagal menyimpan sesi. Hubungi dosen.');
    if (S.v >= CFG.MAKS_PELANGGARAN) { selesaikan('dihentikan'); return; }
    mulaiSesi(); S.locked = true; tampilPeringatan(S.log[S.log.length - 1].r);
    return;
  }

  const n = Math.min(CFG.JUMLAH_SOAL, BANK_SOAL.length);
  const soal = pilihSoal(n).map(i => {
    const it = BANK_SOAL[i];
    const op = perm(it.o.length).map(p => ({ t: it.o[p], c: p === it.a }));
    return { id: i, tp: it.t, q: it.q, o: op.map(x => x.t), a: op.findIndex(x => x.c), e: it.e };
  });
  const now = Date.now();
  S = { nama, nim, kelas, soal, ans: new Array(n).fill(null), idx: 0, v: 0, log: [], start: now,

  if (!saveSes()) { S = null; return toast('Gagal menyimpan sesi ujian. Ujian tidak dapat dimulai.'); }
  mulaiSesi();
}

/* ===================== ANTI-CURANG (MAKS. 3 PERINGATAN) ===================== */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

              <td style="${th} font-weight:700;">${esc(x.nama)}</td><td style="${th}">${esc(x.nim)}</td><td style="${th}">${esc(x.kelas)}</td>
              <td style="${th} font-weight:800; color:var(--brand);">${x.nilai}</td><td style="${th}">${esc(x.status || 'Selesai')}</td>
              <td style="${th} font-weight:600; color:${x.violations > 0 ? 'var(--r)' : 'var(--g-txt)'};" title="${esc((x.log || []).map(l => l.r).join('; '))}">${esc(ketCurang(x))}</td>
              <td style="${th}">${aksi(x.nim)}</td></tr>`).join('')}
            ${aktif.map(x => `<tr style="border-bottom:1px solid var(--slate-200); background:var(--y-bg);">
              <td style="${th} font-weight:700;">${esc(x.nama)}</td><td style="${th}">${esc(x.nim)}</td><td style="${th}">${esc(x.kelas)}</td>
              <td style="${th}">-</td><td style="${th}">Belum selesai / terputus</td><td style="${th}">${x.v}x Pelanggaran</td><td style="${th}">${aksi(x.nim)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>`}
      <button class="btn alt" style="width:100%; margin-top:24px;" onclick="keHome()">Keluar Dari Area Dosen</button>
    </section>
  </div>`;
}
function bukaKunci(nim) {
  dlg({ judul: 'Buka Kunci Peserta', pesan: `Hapus data NIM ${nim} agar dapat mengikuti asesmen sekali lagi? Nilai lama akan terhapus.`,
        tombol: 'Buka Kunci', bahaya: true,
        aksi: () => { const n = normNim(nim); lsSet(K_RES, hasilSemua().filter(r => normNim(r.nim) !== n)); lsDel(K_SES + n); render(true); toast('Kunci dibuka untuk NIM ' + nim); } });
}
const csvCell = c => { let s = String(c); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
function expCSV() {
  const rs = hasilSemua(), aktif = sesiAktif();
  if (!rs.length && !aktif.length) return toast('Belum ada data nilai mahasiswa untuk diunduh.');
  const rows = [['Nama', 'NIM', 'Kelas', 'Nilai Akhir', 'Status', 'Keterangan Kecurangan']];
  rs.forEach(x => rows.push([x.nama, x.nim, x.kelas, x.nilai, x.status || 'Selesai', ketCurang(x)]));
  aktif.forEach(x => rows.push([x.nama, x.nim, x.kelas, '', 'Belum selesai / terputus', `${x.v}x Pelanggaran`]));
  dlFile('Rekap_Nilai_DBA_Pertemuan9.csv', '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
  toast('Rekap CSV Berhasil Diunduh!');
}
function expJSON() {
  const rs = hasilSemua();
  if (!rs.length) return toast('Belum ada data untuk diunduh.');
  dlFile('Data_DBA_Pertemuan9.json', JSON.stringify({ p: rs }, null, 2), 'application/json');
  toast('Data JSON Berhasil Diunduh!');
}
function resetSistem() {
  dlg({ judul: 'Konfirmasi Reset Data', pesan: 'Seluruh data nilai dan sesi ujian di perangkat ini akan DIHAPUS.\n\nKetik HAPUS untuk mengonfirmasi.',
        input: 'text', ph: 'Ketik HAPUS...', tombol: 'Hapus Semua Data', bahaya: true,
        cek: v => v.trim() === 'HAPUS' ? '' : 'Ketik HAPUS dengan huruf besar!',
        aksi: () => {
          const ks = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k.startsWith('dba_assess.p9.'))) ks.push(k); } } catch (e) {}
          ks.forEach(lsDel); render(true); toast('Seluruh data berhasil direset!');
        } });
}
function dlFile(nama, t, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: mime })); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===================== DIALOG SISTEM ===================== */
function dlg(o) {
  const d = $('#dlg');
  d.innerHTML = `<div class="dlg-box" role="dialog" aria-modal="true">
    <h3 style="margin-bottom:6px;">${esc(o.judul)}</h3>
    <p style="font-size:.92rem; color:var(--slate-600); margin-bottom:12px;">${esc(o.pesan)}</p>
    ${o.input ? `<input id="dlg-in" type="${o.input}" autocomplete="off" placeholder="${esc(o.ph || '')}">` : ''}
    <p id="dlg-err" class="dlg-err"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn alt" id="dlg-no">${o.info ? 'Tutup' : 'Batal'}</button>
      ${o.info ? '' : `<button class="btn ${o.bahaya ? 'danger' : ''}" id="dlg-ok">${esc(o.tombol)}</button>`}
    </div></div>`;
  d.hidden = false;
  const inp = $('#dlg-in'), ok = $('#dlg-ok');
  const tutup = () => { d.hidden = true; d.innerHTML = ''; d.onkeydown = null; };
  let sibuk = false;
  $('#dlg-no').onclick = tutup;
  if (ok) ok.onclick = async () => {
    if (sibuk) return; sibuk = true;
    const err = o.cek ? await o.cek(inp ? inp.value : '') : '';
    if (err) { $('#dlg-err').textContent = err; sibuk = false; return; }
    tutup(); o.aksi();
  };
  d.onkeydown = ev => { if (ev.key === 'Escape') tutup(); else if (ev.key === 'Enter' && ok) ok.click(); };
  (inp || ok || $('#dlg-no')).focus();
}

render();
</script>
</body>
</html>
